# Builds WakeBridge the way F-Droid's build server does, so F-Droid can reproduce the release APK
# and publish it with this signature: Google's SDK platform and build-tools installed by F-Droid's
# sdkmanager (from Google's servers, as on F-Droid's build server), and JDK 21. The runner's
# preinstalled SDK is deleted first, so its package revisions can't leak in.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MAVEN_MIRROR: https://maven-central.storage-download.googleapis.com/maven2
      ANDROID_HOME: ${{ github.workspace }}/../android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache SDK downloads and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sdkmanager
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sdk-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/**', '.github/workflows/build.yml') }}
          restore-keys: sdk-${{ runner.os }}-

      # Maven Central rate-limits GitHub's shared runners (HTTP 429): fetch through Google's
      # public mirror of it. Same files, so the APK doesn't change.
      - name: Fetch Maven Central through Google's mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/central-mirror.gradle <<'EOF'
            def mirror = "https://maven-central.storage-download.googleapis.com/maven2/"
            def redirect = { RepositoryHandler repos ->
                repos.withType(MavenArtifactRepository).configureEach { repo ->
                    if (repo.url.toString().startsWith("https://repo.maven.apache.org/maven2")) {
                        repo.url = mirror
                    }
                }
            }
            def mirrorFirst = { RepositoryHandler repos ->
                def m = repos.maven { name = "CentralMirror"; url = mirror }
                repos.remove(m)
                repos.addFirst(m)
            }
            beforeSettings { settings ->
                mirrorFirst(settings.buildscript.repositories)
            }
            settingsEvaluated { settings ->
                mirrorFirst(settings.pluginManagement.repositories)
                redirect(settings.dependencyResolutionManagement.repositories)
            }
            allprojects {
                mirrorFirst(buildscript.repositories)
            }
          EOF

      - name: Install the SDK with F-Droid's sdkmanager
        run: |
          sudo rm -rf /usr/local/lib/android
          pipx install sdkmanager==0.7.2
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      # Optional: sign with a fixed debug key so builds install over each other.
      # Store it base64-encoded as the repository secret DEBUG_KEYSTORE.
      - name: Debug signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        if: env.DEBUG_KEYSTORE != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      # Optional: sign release builds with the release key. Store the keystore base64-encoded as
      # the repository secret RELEASE_KEYSTORE and its password as RELEASE_STORE_PASSWORD
      # (guide: LuccoJ/Android-Development). Without them the release APK is unsigned and not
      # uploaded.
      - name: Release signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        if: env.RELEASE_KEYSTORE != ''
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, test and lint
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug -ProbolectricRepoUrl="$MAVEN_MIRROR"

      # Uploaded unzipped, so it downloads as an .apk; the file's name becomes the artifact's
      - name: Name the APK after the version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "WakeBridge-$version-debug.apk"
          echo "APK=WakeBridge-$version-debug.apk" >> "$GITHUB_ENV"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "WakeBridge-$version.apk"
            echo "RELEASE_APK=WakeBridge-$version.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK }}
          archive: false

      - name: Show the release signing certificate
        if: env.RELEASE_APK != ''
        run: '"$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$RELEASE_APK"'

      - name: Upload signed release APK
        if: env.RELEASE_APK != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.RELEASE_APK }}
          archive: false

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
